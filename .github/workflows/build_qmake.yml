name: Build Matrix

on: [push, workflow_dispatch]

# Least privilege: read the code; id-token + attestations only to sign build provenance
permissions:
  contents: read
  id-token: write
  attestations: write

# Every build runs build.sh, the same script hand builds use: sources, flags and the version
# stamp live there only. This file installs the tools, runs the TLS test and packages.

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 20
    env:
      BS_PORTABLE: "1"
      # Tag builds know which release they are (version check); empty for branch builds
      BS_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "Windows 64bit"
          artifact: "bricksync-win64"
          os: windows-latest
          msystem: MINGW64
          msystem_lower: mingw64
          arch: x86_64
          target: win64

        - name: "Windows 32bit"
          artifact: "bricksync-win32"
          os: windows-latest
          msystem: MINGW32
          msystem_lower: mingw32
          arch: i686
          target: win32

        - name: "Ubuntu 22.04 64bit"
          artifact: "bricksync-linux64"
          os: ubuntu-22.04
          target: linux64

        # Each Mac build runs on its own chip, so the tests run natively (no Rosetta)
        - name: "macOS Intel"
          artifact: "bricksync-macos-x64"
          os: macos-15-intel
          target: macos-x64
          openssl_target: darwin64-x86_64-cc

        - name: "macOS Apple Silicon"
          artifact: "bricksync-macos-arm64"
          os: macos-15
          target: macos-arm64
          openssl_target: darwin64-arm64-cc

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Compiler on Windows
      if: startsWith(matrix.config.os, 'windows')
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: ${{ matrix.config.msystem }}
        install: zip mingw-w64-${{ matrix.config.arch }}-toolchain mingw-w64-${{ matrix.config.arch }}-openssl mingw-w64-${{ matrix.config.arch }}-ca-certificates
        update: true

    - name: Setup Compiler on Linux
      if: startsWith(matrix.config.os, 'ubuntu')
      run: sudo apt-get install -y libssl-dev

    # OpenSSL for the Mac builds is built here from the release tarball (checksum pinned), static,
    # for macOS 11+. Homebrew's would only run on the runner's own macOS version. Its default
    # certificate paths point under /var/empty (root-owned, empty), so nobody can plant a root there;
    # tcp.c loads Apple's /etc/ssl/cert.pem and the cacert.pem shipped next to the binary.
    - name: Build OpenSSL on macOS
      if: startsWith(matrix.config.os, 'macos')
      shell: bash
      env:
        OPENSSL_VERSION: "3.5.9"
        OPENSSL_SHA256: "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
      run: |
        set -e
        cd "$RUNNER_TEMP"
        curl -fsSL -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
        echo "$OPENSSL_SHA256  openssl.tar.gz" | shasum -a 256 -c -
        tar -xzf openssl.tar.gz
        cd "openssl-$OPENSSL_VERSION"
        ./Configure ${{ matrix.config.openssl_target }} no-shared no-tests no-docs \
          --prefix="$RUNNER_TEMP/openssl" --openssldir=/var/empty/bricksync-openssl \
          -mmacosx-version-min=11.0
        make -j"$(sysctl -n hw.ncpu)" build_libs > /dev/null
        make install_dev > /dev/null
        ls -l "$RUNNER_TEMP/openssl/lib"

    - name: Build on macOS
      if: startsWith(matrix.config.os, 'macos')
      shell: bash
      run: |
        set -e
        export BS_BUILD_ID=$(date -u +%Y%m%d).${{ github.run_number }}
        export OPENSSL_DIR="$RUNNER_TEMP/openssl"
        ./build.sh ${{ matrix.config.target }} test
        echo "--- What the binary is and what it links (no OpenSSL library may be listed)"
        file bricksync
        otool -L bricksync
        if otool -L bricksync | grep -i -E "ssl|crypto"; then echo "bricksync needs an OpenSSL library"; exit 1; fi
        otool -l bricksync | grep -A4 LC_BUILD_VERSION | grep minos
        codesign --verify --verbose bricksync
        echo "--- TLS test with cacert.pem next to the binary (Mozilla's list, from Homebrew)"
        brew list ca-certificates >/dev/null 2>&1 || brew install ca-certificates
        pem="$(brew --prefix ca-certificates)/share/ca-certificates/cacert.pem"
        test -s "$pem"
        mkdir -p withpem
        cp tlstest withpem/
        cp "$pem" withpem/cacert.pem
        ./withpem/tlstest
        pkg=bricksync-${{ matrix.config.target }}
        mkdir -p "$pkg/data"
        cp bricksync "$pkg/"
        cp "$pem" "$pkg/cacert.pem"
        cp bricksync.conf.txt "$pkg/data/"
        cp macos/BrickSync.command macos/HOW-TO-RUN-ON-MAC.txt "$pkg/"
        chmod +x "$pkg/bricksync" "$pkg/BrickSync.command"
        zipname=$pkg-1.7.4-${{ github.run_number }}.zip
        ditto -c -k --keepParent "$pkg" "$zipname"
        shasum -a 256 "$zipname" | tee "$zipname.sha256"

    - name: Upload on macOS
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: startsWith(matrix.config.os, 'macos')
      with:
        name: ${{ matrix.config.artifact }}
        path: |
          *.zip
          *.zip.sha256

    - name: Build on Windows
      if: startsWith(matrix.config.os, 'windows')
      shell: msys2 {0}
      run: |
        export BS_BUILD_ID=$(date -u +%Y%m%d).${{ github.run_number }}
        openssl version
        ./build.sh ${{ matrix.config.target }} test
        echo "--- TLS test with cacert.pem next to the exe"
        mkdir -p withpem
        cp tlstest.exe withpem/
        cp /${{ matrix.config.msystem_lower }}/etc/ssl/certs/ca-bundle.crt withpem/cacert.pem
        ./withpem/tlstest.exe
        echo "--- DLLs bricksync.exe needs (must all be Windows system DLLs)"
        objdump -p bricksync.exe | grep "DLL Name"
        if objdump -p bricksync.exe | grep -i "DLL Name" | grep -i -E "ssl|crypto|libgcc|winpthread"; then echo "bricksync.exe needs a non-system DLL"; exit 1; fi
        mkdir -p bricksync-${{ matrix.config.target }}/data
        cp bricksync.exe bricksync-${{ matrix.config.target }}
        cp withpem/cacert.pem bricksync-${{ matrix.config.target }}
        cp bricksync.conf.txt bricksync-${{ matrix.config.target }}/data
        zip -r bricksync-${{ matrix.config.target }}-1.7.4-${{ github.run_number }}.zip bricksync-${{ matrix.config.target }}
        sha256sum bricksync-${{ matrix.config.target }}-1.7.4-${{ github.run_number }}.zip | tee bricksync-${{ matrix.config.target }}-1.7.4-${{ github.run_number }}.zip.sha256

    - name: Upload on Windows
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: startsWith(matrix.config.os, 'windows')
      with:
        name: ${{ matrix.config.artifact }}
        path: |
          *.zip
          *.zip.sha256

    - name: Build on Linux
      if: startsWith(matrix.config.os, 'ubuntu')
      shell: bash
      run: |
        export BS_BUILD_ID=$(date -u +%Y%m%d).${{ github.run_number }}
        openssl version
        ./build.sh linux64 test
        mkdir -p bricksync-linux64/data
        cp bricksync bricksync-linux64
        cp bricksync.conf.txt bricksync-linux64/data
        tar -cvzf bricksync-linux64-1.7.4-${{ github.run_number }}.tar.gz bricksync-linux64
        sha256sum bricksync-linux64-1.7.4-${{ github.run_number }}.tar.gz | tee bricksync-linux64-1.7.4-${{ github.run_number }}.tar.gz.sha256

    # Signed record that this package was built here, from this commit (gh attestation verify <file> -R ZZJHONS/Bricksync)
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "bricksync-*-1.7.4-${{ github.run_number }}.*[pz]"

    - name: Upload on Linux
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: startsWith(matrix.config.os, 'ubuntu')
      with:
        name: ${{ matrix.config.artifact }}
        path: |
          *.tar.gz
          *.tar.gz.sha256
